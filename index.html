<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My heart profile❤️</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css" />

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #ffafbd, #ffc3a0);
            text-align: center;
            overflow-x: hidden;
            height:100hv;
            animation: fadeIn 2s ease-in-out;
            position: relative;
            color: #333; /* Slightly darker text for readability */
        }

        header {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            animation: glow 1.5s infinite alternate;
            margin-bottom: 20px;
        }

        .hidden { display: none; }
        .typing-text { 
            font-size: 1.2rem; 
            white-space: pre-wrap; 
            overflow: hidden; 
            border-right: 3px solid pink; 
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff4081; }
            to { text-shadow: 0 0 20px #ff80ab; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            bottom: 0;
            font-size: 24px;
            opacity: 0.8;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* Slideshow Styling */
        .swiper {
            width: 90%;
            height: 700px;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 5px 20px rgba(255, 105, 180, 0.5);
            margin-bottom: 30px; /* Added spacing for better separation */
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        /* Love Letter Section */
        .love-letter {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(255, 105, 180, 0.3);
            color: #ff4081;
            font-size: 1.2rem;
            font-family: 'Dancing Script', cursive;
        }

        /* Button Style */
        .btn-special {
            background: #ff4081;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .btn-special:hover {
            background: #ff80ab;
        }

        .queen {
        }

        /* Footer Styling */
        footer {
            background-color: #ff4081;
            color: white;
            padding: 20px 0;
            font-size: 1rem;
            margin-top: 30px;
        }

        footer p {
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

    </style>
</head>
<body class="bg-pink-100 text-white">

    <header class="p-6 text-pink-500 font-bold">For My Love, Latifa ❤️</header>

    <!-- Romantic Image Slider -->
    <section class="mt-6">
        <h2 class="text-2xl font-semibold text-pink-700">Our Beautiful Moments Together 💕</h2>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="IMG_1.jpg" alt="Memory 1"></div>
                <div class="swiper-slide"><img src="IMG_2.jpeg" alt="Memory 2"></div>
                <div class="swiper-slide"><img src="IMG_3.jpeg" alt="Memory 3"></div>
                <div class="swiper-slide"><img src="IMG_5.jpg" alt="Memory 4"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </section>

    <!-- Love Letter Typing Animation -->
    <section class="mt-10 p-6">
        <h2 class="text-2xl font-semibold text-pink-700">A Special Love Letter 💌</h2>
        <div class="love-letter">
            <p id="typing-text"></p>
        </div>
    </section>

    <section class="queen">
        <!-- Surprise Message Button -->
        <button class="btn-special" onclick="showMessage()">Click for a Surprise Message 💖</button>
        <p id="surprise-message" class="hidden text-xl text-pink-700 mt-4">I love you forever, my queen! 👑❤️</p>
    </section>

    <!-- Floating Hearts Effect -->
    <script>
        setInterval(() => {
            let heart = document.createElement("div");
            heart.innerHTML = "❤️";
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }, 700);

        // Typing Effect for Love Letter
        const letter = "My dearest Latifa,\n\nYou are my sunshine, my happiness, and my forever love. ❤️";
        let i = 0;
        function typeLetter() {
            if (i < letter.length) {
                document.getElementById("typing-text").innerHTML += letter.charAt(i);
                i++;
                setTimeout(typeLetter, 50);
            }
        }
        typeLetter();

        // Swiper Initialization (Image Slider)
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 1,
            spaceBetween: 10,
            loop: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            autoplay: {
                delay: 3000,  // Set the delay for each slide transition (in milliseconds)
                disableOnInteraction: false,  // Continue autoplay even after user interacts
            },
        });

        // Surprise Message Function
        function showMessage() {
            document.getElementById("surprise-message").classList.toggle("hidden");
        }
    </script>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Mr Alchemyʼs Love to Latifa ❤️ | All Rights Reserved</p>
    </footer>

</body>
</html>
